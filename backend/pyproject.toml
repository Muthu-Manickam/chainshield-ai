[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ml",
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "pwdlib[argon2]==0.4.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.33",
    "sentence-transformers==6.3.0",
    "pypdf==7.1.0",
    "langgraph==1.2.22",
    "langchain-openai==1.8.0",
    "langchain-core==1.8.0",
    "langchain-text-splitters==1.1.3",
    "langfuse==5.2.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5"]

[tool.uv.sources]
ml = { workspace = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
