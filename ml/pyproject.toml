[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "joblib==1.6.0",
    "torch==2.15.0",
    "transformers==5.23.0",
    "datasets==5.2.0",
    "accelerate==1.15.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["ml"]
